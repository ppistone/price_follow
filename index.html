<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>价格 / 库存跟踪看板</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --border:#e5e7eb; --text:#1f2937;
    --muted:#6b7280; --accent:#2563eb; --c1:#2563eb; --c2:#ea580c; --c3:#16a34a;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  #app{display:flex;height:100vh;overflow:hidden}
  /* ---- 左侧菜单 ---- */
  #sidebar{width:264px;flex:0 0 264px;background:var(--panel);border-right:1px solid var(--border);
          display:flex;flex-direction:column}
  .brand{padding:18px 18px 10px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .hint{padding:0 18px 12px;color:var(--muted);font-size:12px}
  .menu-search{padding:0 14px 10px}
  .menu-search input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none}
  .menu-search input:focus{border-color:var(--accent)}
  #menu{flex:1;overflow-y:auto;padding:4px 10px 16px}
  .menu-item{padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:4px;
             display:flex;flex-direction:column;gap:2px;border:1px solid transparent}
  .menu-item:hover{background:#f0f4ff}
  .menu-item.active{background:#e8f0fe;border-color:#c7d8fb}
  .menu-item .mi-name{font-weight:600}
  .menu-item .mi-sub{font-size:11px;color:var(--muted)}
  .side-foot{padding:12px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
  /* ---- 右侧内容 ---- */
  #content{flex:1;overflow-y:auto;padding:26px 32px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;
        box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
  .panel-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-bottom:6px}
  .panel-head h1{font-size:22px;margin:0}
  .latest{font-size:13px;color:var(--muted)}
  .latest b{font-size:20px;color:var(--text);margin:0 4px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
  .chip{font-size:12px;padding:3px 10px;border-radius:999px;background:#f1f5f9;border:1px solid var(--border);color:var(--muted)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 2px;font-size:12px;color:var(--muted)}
  .legend .lg{display:flex;align-items:center;gap:6px}
  .legend .sw{width:14px;height:3px;border-radius:2px}
  .chart-wrap{position:relative;width:100%}
  svg.chart{width:100%;height:auto;display:block}
  .tip{position:absolute;pointer-events:none;background:#111827;color:#fff;padding:8px 10px;border-radius:8px;
       font-size:12px;opacity:0;transition:opacity .08s;white-space:nowrap;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .tip .t-d{color:#9ca3af;margin-bottom:4px}
  .tip .t-r{display:flex;align-items:center;gap:6px}
  .tip .t-sw{width:10px;height:10px;border-radius:2px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--muted);font-weight:600;background:#fafbfc}
  .src-tag{font-size:11px;padding:2px 7px;border-radius:6px;color:#fff}
  .note{font-size:13px;color:var(--muted);line-height:1.7}
  .note b{color:var(--text)}
  .empty{padding:60px;text-align:center;color:var(--muted)}
  .err{padding:14px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:10px;font-size:13px}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

    <div class="brand"><span class="dot"></span>跟踪看板</div>

const COLORS = ["#2563eb","#ea580c","#16a34a","#9333ea","#0891b2","#ca8a04"];
let activeId = null;

/* ---------- 菜单 ---------- */
function renderMenu(filter=""){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  TARGETS.filter(t => t.name.includes(filter)).forEach(t => {
    const div = document.createElement("div");
    div.className = "menu-item" + (t.id===activeId ? " active":"");
    div.innerHTML = `<div class="mi-name">${t.name}</div><div class="mi-sub">${t.unit}</div>`;
    div.onclick = () => selectTarget(t.id);
    menu.appendChild(div);
  });
  if(!menu.children.length) menu.innerHTML = '<div class="empty" style="padding:20px">无匹配标的</div>';
}

/* ---------- 选择标的 ---------- */
function selectTarget(id){
  activeId = id;
  renderMenu(document.getElementById("search").value);
  const t = TARGETS.find(x => x.id===id);
  const content = document.getElementById("content");
  content.innerHTML = `<div class="card"><div class="empty">加载中…</div></div>`;

  loadData(t).then(rows => {
    if(rows.error){
      content.innerHTML = `<div class="card"><div class="err">数据加载失败：${rows.error}<br>
        若以 file:// 直接打开，请改用本地服务器或部署到 GitHub Pages。</div></div>`;
      return;
    }
    renderPanel(t, rows.data);
  });
}

/* ---------- 数据加载：优先 fetch CSV，失败用内联兜底 ---------- */
async function loadData(t){
  try{
    const res = await fetch(t.csv, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if(rows.length) return {data: rows};
    throw new Error("CSV 为空");
  }catch(e){
    if(t.fallback && t.fallback.length) return {data: t.fallback.map(r => ({date:r[0], v:+r[1], src:r[2]}))};
    return {error: e.message};
  }
}
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  const out = [];
  for(let i=0;i<lines.length;i++){
    const c = lines[i].split(",");
    if(i===0 && isNaN(parseFloat(c[1]))) continue; // 跳过表头
    out.push({date:c[0].trim(), v:parseFloat(c[1]), src:c[2] ? c[2].trim() : "默认值"});
  }
  return out;
}

/* ---------- 渲染面板 ---------- */
function renderPanel(t, rows){
  // 按 source 分组
  const groups = {};
  rows.forEach(r => { (groups[r.src] = groups[r.src] || []).push(r); });
  const srcNames = t.sources && t.sources.length ? t.sources : Object.keys(groups);
  const series = srcNames.map((name,i) => ({
    name, color: COLORS[i % COLORS.length],
    points: (groups[name]||[]).map(r => ({t: new Date(r.date).getTime(), date:r.date, v:r.v}))
              .sort((a,b)=>a.t-b.t)
  })).filter(s => s.points.length);

  // 最新值（取所有点中时间最大者）
  let latest = null;
  rows.forEach(r => { const tm=new Date(r.date).getTime(); if(!latest||tm>latest.tm) latest={tm, date:r.date, v:r.v, src:r.src}; });

  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="card">
      <div class="panel-head">
        <h1>${t.name}</h1>
        ${latest ? `<div class="latest">最新 <b>${latest.v}</b> ${t.unit} <span style="color:var(--muted)">（${latest.date} · ${latest.src}）</span></div>` : ""}
      </div>
      <div class="chips">${series.map(s=>`<span class="chip">${s.name}</span>`).join("")}</div>
      <div class="legend" id="legend"></div>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 4px">数据明细</h3>
      <div id="tableWrap"></div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 6px">数据说明</h3>
      <div class="note">${t.note||""}</div>
    </div>`;

  drawChart(document.getElementById("chartWrap"), series, t.unit);
  buildTable(series, t.unit);
}

/* ---------- 自绘 SVG 折线图（多序列 + 悬停） ---------- */
function drawChart(wrap, series, unit){
  const W = Math.max(640, wrap.clientWidth || 720), H = 420;
  const m = {t:20,r:24,b:42,l:52};
  const pw = W-m.l-m.r, ph = H-m.t-m.b;

  const all = series.flatMap(s=>s.points);
  const tMin = Math.min(...all.map(p=>p.t)), tMax = Math.max(...all.map(p=>p.t));
  const vMin = Math.min(...all.map(p=>p.v)), vMax = Math.max(...all.map(p=>p.v));
  const vLo = Math.max(0, Math.floor(vMin*0.9)), vHi = Math.ceil(vMax*1.05);

  const X = t => m.l + (tMax===tMin?0.5:(t-tMin)/(tMax-tMin))*pw;
  const Y = v => m.t + ph - (v-vLo)/(vHi-vLo)*ph;

  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  // 网格 + Y 轴刻度
  const yticks = 5;
  for(let i=0;i<=yticks;i++){
    const v = vLo + (vHi-vLo)*i/yticks, y = Y(v);
    svg += `<line x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}" stroke="#eef0f3"/>`;
    svg += `<text x="${m.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#9ca3af">${v.toFixed(0)}</text>`;
  }
  // X 轴年份刻度
  const years = [...new Set(all.map(p=>new Date(p.t).getFullYear()))].sort();
  years.forEach(yr=>{
    const d = new Date(yr,0,1).getTime();
    if(d<tMin||d>tMax) return;
    const x = X(d);
    svg += `<line x1="${x}" y1="${m.t}" x2="${x}" y2="${m.t+ph}" stroke="#eef0f3"/>`;
    svg += `<text x="${x}" y="${H-m.b+20}" text-anchor="middle" font-size="11" fill="#9ca3af">${yr}</text>`;
  });
  // 折线 + 点
  series.forEach(s=>{
    const pts = s.points.map(p=>`${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2"/>`;
    s.points.forEach(p=>{ svg += `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="${s.color}"/>`; });
  });
  svg += `<rect id="overlay" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"/>`;
  svg += `<line id="vline" x1="0" y1="${m.t}" x2="0" y2="${m.t+ph}" stroke="#94a3b8" stroke-dasharray="3 3" style="opacity:0"/>`;
  svg += `</svg>`;
  wrap.innerHTML = svg;

  // 图例
  document.getElementById("legend").innerHTML = series.map(s=>
    `<div class="lg"><span class="sw" style="background:${s.color}"></span>${s.name}（${s.points.length} 点）</div>`).join("");

  // 悬停
  const svgEl = wrap.querySelector("svg");
  const overlay = svgEl.querySelector("#overlay");
  const vline = svgEl.querySelector("#vline");
  const tip = document.getElementById("tip");
  const dates = [...new Set(all.map(p=>p.t))].sort((a,b)=>a-b);

  overlay.addEventListener("mousemove", ev=>{
    const rect = svgEl.getBoundingClientRect();
    const scale = W / rect.width;
    const mx = (ev.clientX - rect.left) * scale;
    // 找最近日期
    let near = dates[0], best = 1e15;
    dates.forEach(d=>{ const dd=Math.abs(X(d)-mx); if(dd<best){best=dd;near=d;} });
    const x = X(near);
    vline.setAttribute("x1",x); vline.setAttribute("x2",x); vline.style.opacity=1;
    const dStr = new Date(near).toISOString().slice(0,10);
    let rowsHtml = series.map(s=>{
      const p = s.points.find(q=>q.t===near);
      return p ? `<div class="t-r"><span class="t-sw" style="background:${s.color}"></span>${s.name}：<b>${p.v}</b> ${unit}</div>` : "";
    }).join("");
    tip.innerHTML = `<div class="t-d">${dStr}</div>${rowsHtml}`;
    tip.style.opacity = 1;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = ev.clientX + 14, top = ev.clientY - th - 10;
    if(left + tw > window.innerWidth - 10) left = ev.clientX - tw - 14;
    if(top < 10) top = ev.clientY + 14;
    tip.style.left = left+"px"; tip.style.top = top+"px";
  });
  overlay.addEventListener("mouseleave", ()=>{ tip.style.opacity=0; vline.style.opacity=0; });
}

/* ---------- 数据表格（按 source 分表，日期倒序） ---------- */
function buildTable(series, unit){
  const wrap = document.getElementById("tableWrap");
  let html = "";
  series.forEach(s=>{
    const rows = [...s.points].sort((a,b)=>b.t-a.t);
    html += `<h4 style="margin:14px 0 2px">${s.name}</h4>
      <table><thead><tr><th>日期</th><th>数值（${unit||""}）</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.date}</td><td>${r.v}</td></tr>`).join("")}
      </tbody></table>`;
  });
  wrap.innerHTML = html;
}

/* ---------- 启动 ---------- */
renderMenu();
selectTarget(TARGETS[0].id);
</script>
